name: metrics
# Renders an achievements card with lowlighter/metrics into metrics.achievements.svg.
# Needs a repository secret METRICS_TOKEN: a personal access token with no scopes.
# Manual runs only until the first run succeeds; add a schedule after that.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  achievements:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit behind v3.34, the latest release.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: VinceBono
          filename: metrics.achievements.svg
          config_timezone: America/Detroit
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
